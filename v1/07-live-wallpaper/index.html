<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C-Cloning v1 — "The Wrong Scooter" · Live Wallpaper 9:16</title>
<!--
  ============================================================================
  C-Cloning · v1 "The Wrong Scooter" — LIVE WALLPAPER (9:16, 1080x1920, 32s loop)
  ============================================================================
  Implements the master timeline in ../01-video-script.md and the motion /
  camera / transition / FX spec in ../04-video-generation-prompt.md.

  Timeline (single source of truth, from file 01):
    C1 0:00-0:02  Hook + SEED        WIDE.EYE.STATIC
    C2 0:02-0:06  Setup              MED.EYE.PUSHIN(slow, 100->110%)
    C3 0:06-0:11  Escalation 1       MED.EYE.STATIC + 4-frame impact hold @0:08
    C4 0:11-0:16  Escalation 2       MED-WIDE.EYE.PUSHIN(slight, 100->104%)
    C5 0:16-0:22  Anticipation       FULL.LOW.PUSHIN -> HOLD (freeze @0:18)
    C6 0:22-0:27  Pattern break      WIDE.EYE.STATIC (hook aligns @0:26)
    C7 0:27-0:31  TWIST              WIDE.EYE.PUNCHIN @0:29 + 0.5s TOWED freeze
    C8 0:31-0:32  Payoff / loop      WIDE.EYE.STATIC (== C1 framing)

  Hard cuts only. No dissolves, fades, wipes, glitch or zoom-blur (file 04 §B).
  No camera rotation / orbit / handheld.

  URL params (for review + QA, not needed for wallpaper use):
    ?t=18.5     seek to a timecode and pause (renders that exact frame)
    ?captions=1 enable the two optional captions from file 04 §A
    ?fit=cover  fill the screen instead of letterboxing
    ?grid=1     overlay the wallpaper safe zones (top 15% / bottom 18%)

  Art is hand-authored vector (no raster assets, no external requests) so the
  file is fully self-contained and offline-safe.
  ============================================================================
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  /* Absolute centering (not grid/flex): a 1920px-tall item makes an auto grid row
     grow to 1920px, leaving nothing to centre within, so the scaled stage would
     drop below the fold on any short viewport. translate(-50%,-50%) is immune. */
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;
         background:#45BEEE;transform-origin:center center;
         transform:translate(-50%,-50%)}

  .shot{position:absolute;inset:0;opacity:0;visibility:hidden}
  .shot.on{opacity:1;visibility:visible}   /* hard cut: no transition, ever */
  .shot svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- CAMERA (file 04 §A) ------------------------------------ */
  @keyframes push110 {from{transform:scale(1)}   to{transform:scale(1.10)}}
  @keyframes push104 {from{transform:scale(1)}   to{transform:scale(1.04)}}
  @keyframes shake3  {0%,39%{transform:scale(1) translate(0,0)}
                      40%{transform:scale(1.012) translate(-7px,4px)}
                      42%{transform:scale(1.012) translate(6px,-3px)}
                      44%,100%{transform:scale(1) translate(0,0)}}
  /* C5: low hero-angle gentle rise that settles into the proud hold */
  @keyframes heroRise{0%{transform:scale(1.00) translateY(26px)}
                      33%{transform:scale(1.055) translateY(0)}
                      100%{transform:scale(1.055) translateY(0)}}
  /* C7: quick punch-in on the stamp slam (t=2.0s of 4s => 50%), then settle */
  @keyframes punchIn {0%,50%{transform:scale(1)}
                      55%{transform:scale(1.18)}
                      63%{transform:scale(1.07)}
                      100%{transform:scale(1.07)}}

  .s1 .cam{transform-origin:50% 60%}
  .s2 .cam{transform-origin:42% 52%; animation:push110 4s linear both}
  .s3 .cam{transform-origin:50% 58%; animation:shake3 5s linear both}
  .s4 .cam{transform-origin:50% 58%; animation:push104 5s linear both}
  .s5 .cam{transform-origin:50% 72%; animation:heroRise 6s cubic-bezier(.25,.9,.3,1) both}
  .s6 .cam{transform-origin:50% 60%}
  .s7 .cam{transform-origin:58% 70%; animation:punchIn 4s linear both}
  .s8 .cam{transform-origin:50% 60%}

  /* ---------- CHARACTER / PROP MOTION -------------------------------- */
  /* C1 strut: bouncy 2-step cycle, left edge -> left third */
  @keyframes strutIn{0%{transform:translate(-260px,0)}
                     100%{transform:translate(0,0)}}
  @keyframes strutBob{0%,100%{transform:translateY(0)}
                      25%{transform:translateY(-16px)}
                      50%{transform:translateY(0)}
                      75%{transform:translateY(-16px)}}
  /* PIP coin fumble loop */
  @keyframes fumble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
  /* C2 stamp/pad draw flourish */
  @keyframes drawOut{0%{transform:translate(-40px,26px) scale(.7);opacity:0}
                     45%{transform:translate(0,0) scale(1);opacity:1}
                     100%{transform:translate(0,0) scale(1);opacity:1}}
  @keyframes grinGrow{0%{transform:scale(.94)}60%{transform:scale(1)}100%{transform:scale(1)}}
  /* C3 stamp slam + boot snap */
  @keyframes stampSlam{0%{transform:translate(0,-120px) rotate(-16deg)}
                       18%{transform:translate(0,0) rotate(0deg)}
                       26%{transform:translate(0,-26px) rotate(-4deg)}
                       40%{transform:translate(0,-10px) rotate(0)}
                       100%{transform:translate(0,-10px) rotate(0)}}
  @keyframes bootSnap{0%,34%{transform:translate(0,-140px) scale(.9);opacity:0}
                      40%{transform:translate(0,0) scale(1);opacity:1}
                      100%{transform:translate(0,0) scale(1);opacity:1}}
  /* C4 ticket pop-ins (staggered ~4 frames apart via data-d) */
  @keyframes popIn{0%{transform:scale(.3) rotate(-24deg);opacity:0}
                   60%{transform:scale(1.14) rotate(4deg);opacity:1}
                   100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes polish{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  /* C5 podium hop + flag plant + victory snap, then long freeze */
  @keyframes podiumHop{0%{transform:translate(-120px,90px)}
                       22%{transform:translate(-30px,-70px)}
                       33%{transform:translate(0,0)}
                       100%{transform:translate(0,0)}}
  @keyframes flagPlant{0%,20%{transform:translateY(-180px) rotate(-18deg);opacity:0}
                       33%{transform:translateY(0) rotate(0);opacity:1}
                       100%{transform:translateY(0) rotate(0);opacity:1}}
  /* C6 tow truck rolls in from bg-right, hook aligns at 80% (0:26) */
  @keyframes truckIn{0%{transform:translateX(560px)}
                     80%{transform:translateX(0)}
                     100%{transform:translateX(0)}}
  @keyframes hookSwing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  /* C7 the twist */
  @keyframes hoist{0%,50%{transform:translate(0,0) rotate(0)}
                   100%{transform:translate(-40px,-262px) rotate(-18deg)}}
  @keyframes flung{0%,50%{transform:translate(0,0) rotate(0)}
                   62%{transform:translate(-50px,-120px) rotate(-16deg)}
                   100%{transform:translate(-78px,-88px) rotate(-24deg)}}
  @keyframes capFly{0%,50%{transform:translate(0,0) rotate(0);opacity:1}
                    100%{transform:translate(-40px,-190px) rotate(-124deg);opacity:1}}
  @keyframes stampSmack{0%,49%{transform:scale(2.4) rotate(-26deg);opacity:0}
                        52%{transform:scale(1) rotate(-9deg);opacity:1}
                        56%{transform:scale(1.06) rotate(-9deg);opacity:1}
                        100%{transform:scale(1) rotate(-9deg);opacity:1}}
  @keyframes burst{0%,49%{transform:scale(.2);opacity:0}
                   53%{transform:scale(1.25);opacity:1}
                   70%{transform:scale(1.5);opacity:0}
                   100%{opacity:0}}
  @keyframes flash1{0%,49.5%{opacity:0}50%{opacity:.85}53%,100%{opacity:0}}
  /* C8 payoff */
  @keyframes haulOff{0%{transform:translate(0,0) scale(1)}
                     100%{transform:translate(132px,-46px) scale(.84)}}
  @keyframes waveArm{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(20deg)}}
  @keyframes bootPop{0%{transform:translate(0,0) rotate(0)}
                     100%{transform:translate(-26px,34px) rotate(-40deg)}}
  /* ---------- FX ------------------------------------------------------ */
  @keyframes twinkle{0%,100%{transform:scale(.5);opacity:.15}
                     50%{transform:scale(1.15);opacity:1}}
  @keyframes puffOut{0%{transform:scale(.4);opacity:.95}
                     100%{transform:scale(1.7);opacity:0}}
  @keyframes glint{0%,70%{transform:scale(0);opacity:0}
                   80%{transform:scale(1.2);opacity:1}
                   100%{transform:scale(.6);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes popTiny{0%{transform:scale(0);opacity:0}
                     70%{transform:scale(1.15);opacity:1}
                     100%{transform:scale(1);opacity:1}}
  @keyframes capFade{0%,8%{opacity:0}18%,72%{opacity:1}100%{opacity:0}}

  .anim{animation-fill-mode:both}
  .strutIn{animation:strutIn 2s cubic-bezier(.4,0,.6,1) both}
  .strutBob{animation:strutBob 1s steps(1,end) 0s 2 both}
  .fumble{animation:fumble .8s ease-in-out infinite}
  .drawOut{animation:drawOut 4s cubic-bezier(.2,1.3,.4,1) both}
  .grinGrow{animation:grinGrow 4s ease-out both}
  .stampSlam{animation:stampSlam 5s cubic-bezier(.3,1.6,.4,1) both}
  .bootSnap{animation:bootSnap 5s cubic-bezier(.3,1.7,.4,1) both}
  .popIn{animation:popIn .34s cubic-bezier(.3,1.7,.4,1) both}
  .polish{animation:polish .7s ease-in-out infinite}
  .podiumHop{animation:podiumHop 6s cubic-bezier(.3,1.2,.4,1) both}
  .flagPlant{animation:flagPlant 6s cubic-bezier(.3,1.5,.4,1) both}
  .truckIn{animation:truckIn 5s cubic-bezier(.3,0,.5,1) both}
  .hookSwing{animation:hookSwing 1.6s ease-in-out infinite}
  .hoist{animation:hoist 4s cubic-bezier(.4,0,.5,1) both}
  .flung{animation:flung 4s cubic-bezier(.3,0,.5,1) both}
  .capFly{animation:capFly 4s cubic-bezier(.3,0,.5,1) both}
  .stampSmack{animation:stampSmack 4s cubic-bezier(.2,1.5,.4,1) both}
  .burst{animation:burst 4s ease-out both}
  .flash1{animation:flash1 4s linear both}
  .haulOff{animation:haulOff 1s linear both}
  .waveArm{animation:waveArm .42s ease-in-out infinite}
  .bootPop{animation:bootPop 1s cubic-bezier(.3,1.6,.4,1) both}
  .twinkle{animation:twinkle 1.1s ease-in-out infinite}
  .puffOut{animation:puffOut .5s ease-out both}
  .glint{animation:glint 4s ease-out both}
  .bob{animation:bob 1.4s ease-in-out infinite}
  .popTiny{animation:popTiny .3s cubic-bezier(.3,1.8,.4,1) both}
  .capFade{animation:capFade 2s linear both}

  /* safe-zone overlay (?grid=1) */
  #grid{position:absolute;inset:0;display:none;pointer-events:none}
  #grid.on{display:block}
  #grid i{position:absolute;left:0;right:0;background:rgba(255,0,80,.16);
          border-top:2px dashed rgba(255,0,80,.8);border-bottom:2px dashed rgba(255,0,80,.8)}
  #grid .t{top:0;height:288px}
  #grid .b{bottom:0;height:346px}
  #grid .band{top:480px;height:865px;background:rgba(0,180,255,.10);
              border-color:rgba(0,180,255,.7)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="grid"><i class="t"></i><i class="band"></i><i class="b"></i></div>
</div></div>

<script>
"use strict";
/* ======================================================================
   0. Config + palette (Style Prefix v2 — calibrated to approved renders)
   ====================================================================== */
const Q = new URLSearchParams(location.search);
const CAPTIONS = Q.get("captions") === "1";      // file 04 §A marks these optional
const FIT      = Q.get("fit") === "cover" ? "cover" : "contain";
const SEEK     = Q.has("t") ? parseFloat(Q.get("t")) : null;

const C = {
  INK:"#22201E", SKY:"#45BEEE", CLOUD:"#F6F1E4", ASPHALT:"#4E4E4E",
  ASPHALT_D:"#444444", LINE:"#EDE7D8", RED:"#BB2E25", REDIN:"#D4453B",
  TEAL:"#1F6B68", TEALD:"#14504E", GOLD:"#F0B21C", GOLDD:"#C98F0F",
  SKIN:"#F3C9A0", IVORY:"#F7F1E3", OFFW:"#FBF8F0", PINK:"#E98A86",
  CHROME:"#B9C0C4", CHROME_D:"#8B9398", ORANGE:"#E8862A", TEAR:"#4FA9DE",
  PAPER:"#F4EDDA", TRO:"#2A2522", WOOD:"#7A4A28", WOOD_D:"#5C3720"
};
const IK = (w) => `stroke="${C.INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
/* IKC: same geometry attrs but an explicit stroke colour. Needed because
   `${IK(w)} stroke="X"` emits a DUPLICATE stroke attribute and the HTML parser
   keeps the FIRST one — silently painting everything INK. */
const IKC = (w, col) => `stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;

/* ======================================================================
   1. Environment  (BG_parkinglot_v2)
   ====================================================================== */
function cloud(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})" fill="${C.CLOUD}">
    <ellipse cx="0" cy="0" rx="94" ry="44"/><ellipse cx="-62" cy="12" rx="54" ry="31"/>
    <ellipse cx="62" cy="14" rx="60" ry="33"/><ellipse cx="20" cy="-28" rx="54" ry="36"/>
    <ellipse cx="-26" cy="-24" rx="46" ry="31"/></g>`;
}
function sky(horizon) {
  return `<rect x="0" y="0" width="1080" height="${horizon}" fill="${C.SKY}"/>
    ${cloud(180, 210, 1.0)}${cloud(830, 150, .8)}${cloud(560, 330, .55)}
    ${cloud(980, 420, .5)}`;
}
/* speckled asphalt, generated deterministically so it never flickers */
const _spk = {};
function speckle(horizon) {
  if (_spk[horizon]) return _spk[horizon];
  let s = "", seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 240; i++) {
    s += `<circle cx="${(rnd() * 1080) | 0}" cy="${(horizon + 8 + rnd() * (1912 - horizon)) | 0}" r="${
      (rnd() * 2.6 + .8).toFixed(1)}" fill="#5E5E5E" opacity="${(rnd() * .5 + .2).toFixed(2)}"/>`;
  }
  return (_spk[horizon] = s);
}
function ground(horizon) {
  return `<rect x="0" y="${horizon}" width="1080" height="${1920 - horizon}" fill="${C.ASPHALT}"/>
    <rect x="0" y="${horizon}" width="1080" height="26" fill="${C.ASPHALT_D}"/>${speckle(horizon)}
    <g fill="${C.LINE}" opacity=".78">
      <polygon points="120,1160 150,1160 92,1400 46,1400"/>
      <polygon points="420,1160 450,1160 434,1400 388,1400"/>
      <polygon points="700,1120 726,1120 764,1300 720,1300"/>
      <polygon points="854,1092 876,1092 906,1210 868,1210"/>
    </g>`;
}
/* the ALERT_RED NO-PARKING zone — the seed. Held in the same lower-right
   screen position across C1/C6/C7/C8 (file 02 continuity lock). Pulled up
   so the lettering ends by ~1560px per the wallpaper safe-zone rule.      */
const ZONE_WIDE = { outer: "612,1286 1080,1286 1080,1622 448,1622",
                    inner: "646,1316 1052,1316 1052,1592 492,1592",
                    tx: 812, ty: 1548, fs: 82 };
const ZONE_LOW  = { outer: "690,1606 1080,1606 1080,1816 586,1816",
                    inner: "718,1630 1056,1630 1056,1792 626,1792",
                    tx: 856, ty: 1762, fs: 60 };
function redZone(z) {
  z = z || ZONE_WIDE;
  return `<g>
    <polygon points="${z.outer}" fill="${C.RED}"/>
    <polygon points="${z.outer}" fill="none" stroke="${C.REDIN}" stroke-width="9"/>
    <polygon points="${z.inner}" fill="none" stroke="${C.REDIN}" stroke-width="7" opacity=".8"/>
    ${/* skew must be applied about the text's own origin — a bare skewX(-7) shifts
          x by -tan(7deg)*y, which at y=1548 drags the label ~190px out of the zone */""}
    <g transform="translate(${z.tx},${z.ty}) skewX(-7)">
      <text x="0" y="0" text-anchor="middle" fill="${C.PAPER}" opacity=".62"
        font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="${z.fs}"
        font-weight="900" letter-spacing="2">NO PARKING</text></g></g>`;
}
function meter(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})">
    <rect x="-10" y="-300" width="20" height="300" fill="#3A3A38" ${IK(6)}/>
    <rect x="-42" y="-32" width="84" height="30" rx="9" fill="#3A3A38" ${IK(6)}/>
    <rect x="-54" y="-412" width="108" height="124" rx="20" fill="#3A3A38" ${IK(7)}/>
    <circle cx="0" cy="-374" r="35" fill="${C.OFFW}" ${IK(6)}/>
    <path d="M0,-374 L17,-397" ${IKC(6, C.RED)}/>
    <circle cx="0" cy="-374" r="6" fill="${C.INK}"/>
    <rect x="-17" y="-326" width="34" height="15" rx="6" fill="${C.INK}"/></g>`;
}

/* ======================================================================
   2. Props
   ====================================================================== */
/* PROP_chief_scooter_v2 — classic Vespa side profile, drawn facing +x.
   Tall rear cowl + stepped floorboard + vertical front leg shield + raised
   handlebars, so the silhouette reads "scooter" and not "small car".        */
function vespa(x, y, s, flip) {
  return `<g transform="translate(${x},${y}) scale(${flip ? -s : s},${s})">
    <circle cx="-100" cy="-44" r="44" fill="${C.INK}"/>
    <circle cx="-100" cy="-44" r="18" fill="${C.CHROME}" ${IK(5)}/>
    <circle cx="108" cy="-44" r="44" fill="${C.INK}"/>
    <circle cx="108" cy="-44" r="18" fill="${C.CHROME}" ${IK(5)}/>
    <path d="M126,-236 C150,-232 156,-190 154,-96 L60,-88 L60,-140
             C86,-146 96,-206 126,-236 Z" fill="${C.TEAL}" ${IK(7)}/>
    <path d="M-158,-98 C-166,-158 -140,-196 -74,-204 C-30,-208 -18,-176 -22,-146
             L-24,-88 L-150,-84 Z" fill="${C.TEAL}" ${IK(7)}/>
    <path d="M-26,-146 L62,-142 L62,-86 L-26,-86 Z" fill="${C.TEAL}" ${IK(7)}/>
    <path d="M-74,-204 C-32,-208 -18,-176 -22,-146 L-22,-88 L-64,-86 Z"
          fill="${C.TEALD}" opacity=".38"/>
    <path d="M126,-236 C150,-232 156,-190 154,-96 L124,-92 L124,-224 Z"
          fill="${C.TEALD}" opacity=".38"/>
    <rect x="-146" y="-244" width="126" height="42" rx="20" fill="${C.TRO}" ${IK(6)}/>
    <path d="M134,-232 L152,-306" ${IKC(14, C.CHROME_D)}/>
    <path d="M114,-310 L192,-302" ${IKC(14, C.TRO)}/>
    <path d="M182,-306 L176,-346" ${IKC(8, C.CHROME_D)}/>
    <circle cx="174" cy="-354" r="15" fill="${C.CHROME}" ${IK(5)}/>
    <circle cx="150" cy="-246" r="23" fill="${C.OFFW}" ${IK(6)}/>
    <path d="M96,-186 l24,0 l0,28 l-12,15 l-12,-15 z" fill="${C.GOLD}" ${IK(4)}/>
  </g>`;
}
function kickScooter(x, y, s, flip) {                 // PROP_pip_scooter_v2
  return `<g transform="translate(${x},${y}) scale(${flip ? -s : s},${s})">
    <circle cx="-74" cy="-22" r="24" fill="${C.INK}"/>
    <circle cx="-74" cy="-22" r="9" fill="${C.CHROME}"/>
    <circle cx="72" cy="-22" r="24" fill="${C.INK}"/>
    <circle cx="72" cy="-22" r="9" fill="${C.CHROME}"/>
    <path d="M-78,-44 L64,-52" ${IKC(20, C.TEAL)}/>
    <path d="M64,-52 L84,-188" ${IKC(15, C.TEAL)}/>
    <path d="M40,-192 L128,-192" ${IKC(15, C.TRO)}/>
  </g>`;
}
function boot(x, y, s) {                              // PROP_boot_v2 (yellow hero)
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path d="M-40,-52 C-72,-52 -76,4 -40,6 L-16,6 L-16,-16 L-34,-16 C-46,-18 -46,-32 -34,-34 L-16,-34
             L-16,-52 Z" fill="${C.GOLD}" ${IK(6)}/>
    <path d="M40,-52 C72,-52 76,4 40,6 L16,6 L16,-16 L34,-16 C46,-18 46,-32 34,-34 L16,-34
             L16,-52 Z" fill="${C.GOLD}" ${IK(6)}/>
    <rect x="-22" y="-40" width="44" height="34" rx="8" fill="${C.GOLDD}" ${IK(6)}/>
    <circle cx="-40" cy="-24" r="5" fill="${C.WOOD_D}"/><circle cx="40" cy="-24" r="5" fill="${C.WOOD_D}"/>
  </g>`;
}
function stamp(x, y, s, rot) {                        // PROP_stamp_v2
  return `<g transform="translate(${x},${y}) rotate(${rot || 0}) scale(${s})">
    <rect x="-46" y="-14" width="92" height="42" rx="7" fill="${C.WOOD}" ${IK(6)}/>
    <rect x="-46" y="14" width="92" height="16" rx="5" fill="${C.WOOD_D}" ${IK(6)}/>
    <rect x="-15" y="-58" width="30" height="48" rx="10" fill="${C.GOLDD}" ${IK(6)}/>
    <ellipse cx="0" cy="-70" rx="30" ry="18" fill="${C.GOLD}" ${IK(6)}/>
    <path d="M0,-78 l5,10 l11,1 l-8,8 l2,11 l-10,-6 l-10,6 l2,-11 l-8,-8 l11,-1 z" fill="${C.GOLDD}"/>
  </g>`;
}
function ticket(x, y, s, rot, big) {                  // PROP_ticket_v2
  const w = big ? 96 : 74, h = big ? 128 : 98;
  return `<g transform="translate(${x},${y}) rotate(${rot || 0}) scale(${s})">
    <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="5" fill="${C.PAPER}" ${IK(5)}/>
    <text x="0" y="${-h / 2 + 24}" text-anchor="middle" fill="${C.INK}"
      font-family="Arial,Helvetica,sans-serif" font-size="${big ? 13 : 11}" font-weight="700">PARKING</text>
    <text x="0" y="${-h / 2 + 40}" text-anchor="middle" fill="${C.INK}"
      font-family="Arial,Helvetica,sans-serif" font-size="${big ? 13 : 11}" font-weight="700">TICKET</text>
    <g stroke="${C.INK}" stroke-width="3" opacity=".45">
      <path d="M${-w / 2 + 12},${-h / 2 + 56} H${w / 2 - 12}"/>
      <path d="M${-w / 2 + 12},${-h / 2 + 70} H${w / 2 - 18}"/></g>
    <text x="0" y="${h / 2 - 14}" text-anchor="middle" fill="${C.RED}"
      font-family="Arial Black,Arial,sans-serif" font-size="${big ? 22 : 18}" font-weight="900">$$$</text>
  </g>`;
}
function clipboard(x, y, s, rot, cm) {                // PROP_ticketpad_v2

    case "smug":

        `<path d="M-24,-340 c18,11 42,9 56,-7" ${IK(10)} fill="none"/>`;
    case "gloating":
      return brow(-4, 8) + eyeOpen(15, 8) + must +

          fill="${C.INK}"/><path d="M-40,-344 C-14,-316 34,-316 58,-346" ${IK(8)} fill="none"/>`;

        `<path d="M-44,-346 C-16,-310 38,-310 62,-348 C36,-326 -16,-326 -44,-346 Z" fill="${C.INK}"/>`;
    case "oblivious":

        `<path d="M-22,-338 c18,12 42,10 56,-8" ${IK(10)} fill="none"/>`;

        <path d="M12,-462 c14,-10 36,-10 52,4" ${IK(15)} fill="none"/>` + eyeOpen(25, 9) + must +
        `<ellipse cx="8" cy="-334" rx="26" ry="30" fill="${C.INK}"/>`;

         <ellipse cx="8" cy="-318" rx="17" ry="12" fill="${C.PINK}"/>`;
    default: return chiefFace("smug");
  }

/* ======================================================================
   7. Timeline driver
   ====================================================================== */
const SHOTS = [
  { id: 1, start: 0,  end: 2,  build: shot1 },
  { id: 2, start: 2,  end: 6,  build: shot2 },
  { id: 3, start: 6,  end: 11, build: shot3 },
  { id: 4, start: 11, end: 16, build: shot4 },
  { id: 5, start: 16, end: 22, build: shot5 },
  { id: 6, start: 22, end: 27, build: shot6 },
  { id: 7, start: 27, end: 31, build: shot7 },
  { id: 8, start: 31, end: 32, build: shot8 }
];
const DUR = 32;
const stage = document.getElementById("stage");
const els = SHOTS.map(s => {
  const d = document.createElement("div");
  d.className = "shot s" + s.id;
  d.innerHTML = `<svg viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
    <g class="cam">${s.build()}</g></svg>`;
  stage.insertBefore(d, document.getElementById("grid"));
  return d;
});

function clearSeek(el) {
  el.querySelectorAll(".anim, .cam").forEach(n => {
    const b = n.dataset.d;
    n.style.animationDelay = b ? b + "s" : "";
    n.style.animationPlayState = "";
  });
}
function applySeek(el, off) {
  el.querySelectorAll(".anim, .cam").forEach(n => {
    const b = parseFloat(n.dataset.d || 0);
    n.style.animationDelay = (b + off) + "s";
    n.style.animationPlayState = "paused";
  });
}
let cur = -1;
function activate(i, seekOff) {
  const el = els[i];
  els.forEach(e => { if (e !== el) e.classList.remove("on"); });
  el.classList.remove("on");
  void el.offsetWidth;                 // force reflow => restart every animation
  if (seekOff == null) clearSeek(el); else applySeek(el, seekOff);
  el.classList.add("on");
  cur = i;
}
function shotAt(t) {
  for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i].start && t < SHOTS[i].end) return i;
  return SHOTS.length - 1;
}

/* fit the 1080x1920 stage to whatever surface we're painted on */
function fit() {
  const k = FIT === "cover"
    ? Math.max(innerWidth / 1080, innerHeight / 1920)
    : Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = "translate(-50%,-50%) scale(" + k + ")";
}
/* ?raw=1 — QA mode: lay the stage out at native 1080x1920 with no scaling so a
   full-page screenshot captures true resolution. Not used for wallpaper duty. */
if (Q.get("raw") === "1") {
  document.documentElement.style.cssText = "overflow:visible;height:auto";
  document.body.style.cssText = "margin:0;overflow:visible;height:auto;width:1080px";
  document.getElementById("wrap").style.cssText = "position:static;overflow:visible";
  stage.style.cssText += ";position:relative;left:0;top:0;transform:none";
} else {
  addEventListener("resize", fit); fit();
}
if (Q.get("grid") === "1") document.getElementById("grid").classList.add("on");

if (SEEK != null) {
  const t = Math.max(0, Math.min(DUR - .001, SEEK));
  const i = shotAt(t);
  activate(i, -(t - SHOTS[i].start));
} else {
  const t0 = performance.now();
  let raf = () => {
    const t = ((performance.now() - t0) / 1000) % DUR;
    const i = shotAt(t);
    if (i !== cur) activate(i, null);
    requestAnimationFrame(raf);
  };
  requestAnimationFrame(raf);
  document.addEventListener("visibilitychange", () => {           // battery friendly
    if (!document.hidden && cur >= 0) { /* animations resume natively */ }
  });
}
